<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obsidian Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="config.js?v=shopify-activate-20261029"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E0D;--side:#0C100F;--card:#111615;--card2:#0F1413;--line:#1F2925;--line2:#26312C;--soft:#18201D;
  --tx:#E8EEEA;--tx2:#DCE5E0;--mut:#9AA9A2;--mut2:#8C9C95;
  --em:#3DDC97;--em2:#5FE6AC;--emd:#0F2A1F;--blue:#8EC3FF;--blued:#13243A;--amb:#F2C063;--ambd:#2B2312;
  --lil:#CDB4F5;--lild:#231A2E;--cor:#F2A08A;--cord:#2E1B16;--teal:#7FD6E8;--teald:#10262B;--gry:#C9CCD6;--gryd:#1E2026;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--em);text-decoration:none}a:hover{color:#8BF0C4}
button{font-family:inherit}
::selection{background:#3DDC9740}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
html,*{scrollbar-width:thin;scrollbar-color:#2A3A33 transparent}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#24302B;border-radius:999px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--em);border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-corner{background:transparent}*::-webkit-scrollbar-button{display:none;width:0;height:0}
.mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum" 1,"zero" 1}
.mut{color:var(--mut)}.mut2{color:var(--mut2)}.em{color:var(--em2)}.cor{color:var(--cor)}.amb{color:var(--amb)}
.sm{font-size:12px}.r{text-align:right}

/* shell */
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 240px;max-width:100%;background:linear-gradient(180deg,#0E1312,#0A0D0C);box-shadow:1px 0 0 #1A2320,24px 0 48px -32px #000;padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.main{flex:999 1 560px;min-width:0;padding:32px 40px 64px;display:flex;flex-direction:column;gap:22px;background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:22px 22px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-size:15px;font-weight:600;letter-spacing:-.3px}
.gem{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#1E3A2E,#101A16);box-shadow:0 0 0 1px #2A4A3B,0 8px 24px -8px #3DDC9780,inset 0 1px 0 #ffffff1a;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.nav a svg{opacity:.8}.nav a:hover{background:#151B19;color:var(--tx)}
.nav a.on{background:linear-gradient(90deg,#163127,#121C18 75%);box-shadow:inset 0 0 0 1px #24402F;color:var(--tx)}
.nav a.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--em);box-shadow:0 0 14px var(--em)}
.nav a.on svg{color:var(--em);opacity:1}
.who{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;background:#101514}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut2);padding:0 8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--em);box-shadow:0 0 8px var(--em);flex-shrink:0}
.dot.warn{background:var(--amb);box-shadow:0 0 8px var(--amb)}.dot.bad{background:var(--cor);box-shadow:0 0 8px var(--cor)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex-shrink:0}

/* building blocks */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:6px 0 0;font-size:32px;font-weight:600;letter-spacing:-1px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.8px;color:var(--em)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:linear-gradient(180deg,#131918,#101514);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 #ffffff0b,0 1px 0 #00000066,0 22px 44px -26px #000000d9}
.pad{padding:22px}.pad-s{padding:16px 18px}
.card h2,.h2{margin:0;font-size:16px;font-weight:600}
.glow{background:linear-gradient(160deg,#12281F,#0D1A15);border:1px solid #1D3A2C;border-radius:14px;box-shadow:inset 0 1px 0 #ffffff10,0 18px 40px -22px #3DDC9766}
.grid{display:grid;gap:16px}.g-auto{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.cols{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.col-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px}
.col-side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:20px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:12px}
.kpi .v{font-size:32px;font-weight:500;letter-spacing:-1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;font:500 13px 'Inter Tight',sans-serif;border:1px solid var(--line2);background:#131917;color:var(--tx2);cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0a;white-space:nowrap;transition:background .15s,filter .15s,transform .1s}
.btn:hover{background:#18201D;color:#fff}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#5BE8AB,#2ECB86);border-color:#45D99A;color:#06120D;font-weight:600;box-shadow:inset 0 1px 0 #ffffff66,0 10px 26px -10px #3DDC97cc}
.btn.pri:hover{filter:brightness(1.07);color:#06120D}
.btn.danger{color:var(--cor);border-color:#4A2C24}
.btn.lg{height:50px;font-size:14px;border-radius:12px}.btn.sm{height:32px;padding:0 10px;font-size:12px}.btn.ic{width:40px;padding:0}.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:inset 0 0 0 1px #ffffff0f}
.chip i{width:6px;height:6px;border-radius:50%;display:block;background:currentColor;box-shadow:0 0 8px 1px currentColor}
.s-new{background:var(--blued);color:var(--blue)}.s-proc{background:var(--ambd);color:var(--amb)}.s-prep{background:var(--emd);color:var(--em2)}
.s-list{background:var(--gryd);color:var(--gry)}.s-sold{background:var(--lild);color:var(--lil)}.s-arch{background:#171A19;color:var(--mut2)}
.code{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font:500 12px 'JetBrains Mono',monospace;white-space:nowrap;cursor:pointer;border:0}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;background:#171E1C;border:1px solid #24302B;color:#B7C3BD;white-space:nowrap}
.bin{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:#151C1A;border:1px solid #24302B;font:500 12px 'JetBrains Mono',monospace;color:#B7C3BD}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--card2);border:1px solid var(--line);flex-wrap:wrap}
.tabs button{height:36px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:var(--mut);font:500 13px 'Inter Tight',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 auto}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:linear-gradient(180deg,#1E2B27,#18221F);box-shadow:inset 0 0 0 1px #2E4239,inset 0 1px 0 #ffffff12,0 4px 12px -6px #000;color:var(--tx)}
.tabs b{font:500 11px 'JetBrains Mono',monospace;color:var(--mut2)}
.search{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--mut2);flex:0 1 320px;min-width:200px}
.search input{border:0;outline:none;background:transparent;color:var(--tx);font:400 13px 'Inter Tight',sans-serif;width:100%}
.sel,.in,.ta{height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);padding:0 13px;font:400 14px 'Inter Tight',sans-serif;outline:none;width:100%;color-scheme:dark;transition:border-color .15s,box-shadow .15s}
.sel.sm{height:40px;width:auto;font-size:13px}
.ta{height:auto;padding:11px 13px;resize:vertical;line-height:1.5;min-height:80px}
.in:focus,.sel:focus,.ta:focus{border-color:var(--em);box-shadow:0 0 0 3px #3DDC9726}
.in.mono{font-family:'JetBrains Mono',monospace}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld>label,.fld>.lb{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:#B7C3BD}
.fld em{font-style:normal;color:var(--em);margin-left:-4px}
.opt{font-size:11px;font-weight:500;color:var(--mut2);padding:2px 7px;border-radius:999px;background:#171E1C;border:1px solid #24302B}
.li{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;flex-shrink:0;color:var(--mut);background:#171E1C;box-shadow:inset 0 0 0 1px var(--line2)}
.li.req{color:var(--em);background:var(--emd);box-shadow:inset 0 0 0 1px #1D4A35,0 0 12px -4px #3DDC9799}
.money{position:relative}.money>span{position:absolute;left:13px;top:13px;color:var(--mut2);font:400 14px 'JetBrains Mono',monospace;pointer-events:none}.money .in{padding-left:28px;font-family:'JetBrains Mono',monospace}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--card2);border:1px solid var(--line);flex-wrap:wrap}
.seg button{flex:1 1 auto;height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--mut);font:500 13px 'Inter Tight',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:linear-gradient(180deg,#1E2B27,#18221F);box-shadow:inset 0 0 0 1px #2E4239,inset 0 1px 0 #ffffff12;color:var(--tx)}
.cd{width:8px;height:8px;border-radius:50%;display:block}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:var(--mut2);text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#0F1413}
td{font-size:14px;color:var(--tx2);padding:12px 16px;border-bottom:1px solid #18201D;white-space:nowrap}
tbody tr{transition:background .12s}tbody tr:hover td{background:#141C19}
tr.click{cursor:pointer}
.cat{border-radius:10px;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 0 0 1px #ffffff12}
.cell-item{display:flex;align-items:center;gap:12px}
.empty{padding:44px 20px;text-align:center;color:var(--mut2);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid #1A2220;font-size:14px}
.row:last-child{border-bottom:0}
.bar{height:8px;border-radius:4px;background:#1A2220;flex-grow:1;overflow:hidden}.bar>div{height:100%;border-radius:4px;background:var(--em)}
.ph{aspect-ratio:1/1;border-radius:12px;background:#151C1A;border:1px solid #24302B;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tools{position:absolute;inset:auto 6px 6px 6px;display:flex;gap:4px;justify-content:space-between;opacity:0;transition:opacity .15s}
.ph:hover .tools,.ph:focus-within .tools{opacity:1}
.ph .tools button{width:28px;height:28px;border-radius:8px;border:0;background:#0B0E0Dd9;color:var(--tx);cursor:pointer;display:grid;place-items:center}
.ph .cover{position:absolute;left:6px;top:6px;font-size:10px;padding:2px 6px;border-radius:4px;background:var(--em);color:#06120D;font-weight:600}
.drop{border:1.5px dashed #2E3B36;border-radius:12px;display:grid;place-items:center;color:var(--mut);font-size:12px;cursor:pointer;aspect-ratio:1/1;background:transparent;text-align:center;padding:8px}
.drop.over{border-color:var(--em);background:#0F1F18;color:var(--em2)}
.steps{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.steps li{display:flex;align-items:center;gap:8px;color:var(--mut2)}.steps li.on{color:var(--tx)}
.steps .n{width:26px;height:26px;border-radius:50%;border:1px solid #2E3B36;display:grid;place-items:center;font:500 12px 'JetBrains Mono',monospace}
.steps li.on .n{background:var(--em);color:#06120D;border-color:var(--em)}.steps li.done .n{background:#16302A;color:var(--em2);border-color:#16302A}
.steps .ln{width:28px;height:1px;background:#2A3632}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:#1A1710;border:1px solid #3A3018;color:#E9D6A6;font-size:13px;line-height:1.5}
.notice.info{background:#0F1A15;border-color:#1D3A2C;color:#BFE8D3}
.notice.bad{background:#1F1210;border-color:#4A2C24;color:#F4C4B6}
.toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 40px))}
.toast{background:#151C1A;border:1px solid #2A3A33;color:var(--tx);padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 18px 40px -16px #000;display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease-out}
.toast.err{border-color:#5A3328;background:#1F1513}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;z-index:200;background:#050706cc;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.modal{width:100%;max-width:640px;background:linear-gradient(180deg,#131918,#101514);border:1px solid #24302B;border-radius:22px;box-shadow:0 30px 80px #000000a0}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:24px 24px 0}
.modal .mb{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.tl li{display:grid;grid-template-columns:56px 22px minmax(0,1fr);gap:0 12px}
.tl .rail{position:relative;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl .pt{position:relative;margin-top:18px;width:11px;height:11px;border-radius:50%}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);color:var(--mut);font:500 12px 'Inter Tight',sans-serif;cursor:pointer}
.fchip b{font:500 11px 'JetBrains Mono',monospace}
.key{height:56px;border-radius:14px;border:1px solid #222C28;background:linear-gradient(180deg,#151C1A,#111715);box-shadow:inset 0 1px 0 #ffffff0d,0 2px 0 #00000055;color:var(--tx);font:500 20px 'JetBrains Mono',monospace;cursor:pointer}
.key:hover{background:#18201D}.key:active{transform:translateY(1px)}.key.g{font:500 13px 'Inter Tight',sans-serif;color:var(--mut)}
.pickrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);width:100%;text-align:left;cursor:pointer;color:var(--tx2);font:inherit}
.pickrow:hover{border-color:#2E3C36}.pickrow.on{border-color:var(--em);background:#0F1F18}
.skel{color:var(--mut2);padding:40px;text-align:center}
@media (max-width:760px){
  .main{padding:20px 16px 48px}.side{padding:16px}.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2.stack,.g3.stack{grid-template-columns:1fr}.span3,.span2{grid-column:1/-1}
  .head h1{font-size:26px}
}
@media (max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}.span2,.span3{grid-column:auto}}
</style>
</head>
<body>
<div id="app"><div class="skel">Opening the vault…</div></div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════
   OBSIDIAN VAULT — single-page app
   Data: shared realtime database (db) · Photos: artifact assets
   ════════════════════════════════════════════════════════════════ */

// ── tiny utils ────────────────────────────────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const money = (n, sign) => { n = +n || 0; return (n < 0 ? '−' : (sign && n > 0 ? '+' : '')) + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const money0 = n => { n = +n || 0; return (n < 0 ? '−' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US'); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const localISO = (d = new Date()) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const fmtDate = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const fmtShort = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
const daysSince = s => s ? Math.max(0, Math.round((new Date(localISO() + 'T12:00:00') - new Date(s + 'T12:00:00')) / 864e5)) : 0;
const nowISO = () => new Date().toISOString();
const uidShort = () => Math.random().toString(36).slice(2, 10);
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const TAB = uidShort();

// ── icons ─────────────────────────────────────────────────────────
const I = {
  gem: '<path d="M12 2.5 20 8l-3 12.5H7L4 8z"/><path d="M4 8h16M12 2.5 9 8l3 12.5L15 8z"/>',
  dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  box: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
  book: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  pulse: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  sliders: '<path d="M4 6h10M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', check: '<path d="m5 12 5 5 9-10"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

//  BACKENDS — the app talks to one interface, whichever is active:
//    db.doc(path)          → { get, set, update, delete, onSnapshot }
//    db.collection(path)   → { limit, get, onSnapshot, doc }
//    db.atomic(path, fn)   → race-free read-modify-write; fn(current|null) returns new data, or undefined to skip
//    assets                → { upload(blob,{type}) → {id}, delete(id), list? }
//  Order of preference: claude.ai shared database → Firebase (config.js) → this browser only.
// ════════════════════════════════════════════════════════════════
const clean = d => JSON.parse(JSON.stringify(d));
const deepMerge = (a, b) => { const o = { ...(a || {}) }; for (const k in b) o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) ? deepMerge(a[k], b[k]) : b[k]; return o; };

// 1) LOCAL MODE — saved in this browser (localStorage for records, IndexedDB for photos)
function localDB() {
  const KEY = 'ov.store.v1'; let store;
  const load = () => { try { store = new Map(Object.entries(JSON.parse(localStorage.getItem(KEY) || '{}'))); } catch (e) { store = new Map(); } };
  load(); const subs = new Set(); const notify = () => subs.forEach(f => f());
  let t = 0; const persist = () => { clearTimeout(t); t = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(store))); } catch (e) { toast('This browser’s storage is full — download a backup and connect Firebase.', 'err'); } }, 120); };
  window.addEventListener('storage', e => { if (e.key === KEY) { load(); notify(); } }); // other tabs in this browser stay in sync
  const snapDoc = p => ({ id: p.split('/').pop(), exists: store.has(p), data: () => store.get(p), metadata: { fromCache: false, hasPendingWrites: false } });
  const put = (p, d) => { store.set(p, clean(d)); notify(); persist(); };
  const doc = p => ({
    id: p.split('/').pop(), path: p,
    get: async () => snapDoc(p),
    set: async d => put(p, d),
    update: async d => { if (!store.has(p)) throw { code: 'invalid_argument', message: 'missing' }; put(p, deepMerge(store.get(p), clean(d))); },
    delete: async () => { store.delete(p); notify(); persist(); },
    onSnapshot: next => { const f = () => next(snapDoc(p)); subs.add(f); setTimeout(f); return () => subs.delete(f); }
  });
  const collection = p => {
    const q = {
      path: p, limit: () => q, doc: id => doc(p + '/' + (id || uidShort())),
      get: async () => { const docs = [...store.keys()].filter(k => k.startsWith(p + '/') && k.split('/').length === p.split('/').length + 1).map(snapDoc); return { docs, size: docs.length, empty: !docs.length }; },
      onSnapshot: next => { const f = async () => next(await q.get()); subs.add(f); setTimeout(f); return () => subs.delete(f); }
    };
    return q;
  };
  const atomic = async (p, fn) => { const nx = fn(store.has(p) ? store.get(p) : null); if (nx !== undefined) put(p, nx); return nx; };
  return { doc, collection, atomic };
}
function localAssets() {
  let dbp = null; const cache = {};
  const open = () => new Promise((res, rej) => { const r = indexedDB.open('ov-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { dbp = dbp || open(); const d = await dbp; return new Promise((res, rej) => { const t = d.transaction('p', mode); const q = fn(t.objectStore('p')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    upload: async blob => { const id = 'local-' + Date.now() + '-' + uidShort(); await tx('readwrite', s => s.put(blob, id)); cache[id] = URL.createObjectURL(blob); return { id, url: cache[id] }; },
    delete: async id => { await tx('readwrite', s => s.delete(id)); return { deleted: true }; },
    url: id => { if (cache[id]) return cache[id]; if (cache[id] === undefined) { cache[id] = null; tx('readonly', s => s.get(id)).then(b => { if (b) { cache[id] = URL.createObjectURL(b); renderSoon(); } }).catch(() => {}); } return null; },
    blob: id => tx('readonly', s => s.get(id))
  };
}

// 2) CLAUDE.AI MODE — the artifact's shared realtime database + asset store
function claudeDB(db) {
  return {
    doc: p => db.doc(p), collection: p => db.collection(p),
    atomic: async (p, fn) => {
      const r = db.doc(p);
      for (let i = 0; i < 25; i++) {
        const lease = await r.acquire({ holder: TAB + '-' + i, ttlMs: 5000 });
        if (lease.acquired) { const s = await r.get(); const nx = fn(s.exists ? s.data() : null); if (nx !== undefined) await r.set(nx); return nx; }
        await sleep(150 + Math.random() * 300);
      }
      throw { code: 'busy', message: 'The vault is busy, try again.' };
    }
  };
}

// 3) FIREBASE MODE — Firestore (records, realtime, offline cache) + Storage (photos) + Auth (email/password)
const FB_VERSION = '10.12.2';
async function firebaseBackend(cfg, opts = {}) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
  const [app, fs, au, st, fu] = await Promise.all(['firebase-app', 'firebase-firestore', 'firebase-auth', 'firebase-storage', 'firebase-functions'].map(m => import(base + m + '.js')));
  const fapp = app.initializeApp(cfg);
  let db; try { db = fs.initializeFirestore(fapp, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); } catch (e) { db = fs.getFirestore(fapp); }
  const auth = au.getAuth(fapp); const storage = st.getStorage(fapp);
  const functions = fu.getFunctions(fapp, 'us-east1');
  const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
  const flat = (o, pre = '', out = {}) => { for (const [k, v] of Object.entries(o)) { const key = pre ? pre + '.' + k : k; if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length) flat(v, key, out); else out[key] = v; } return out; };
  const mapErr = e => { const c = (e && e.code) || ''; return c.includes('permission-denied') ? { code: 'revoked', message: 'This account is not allowed in the vault.' } : c.includes('resource-exhausted') ? { code: 'quota_exceeded', message: e.message } : c.includes('unavailable') ? { code: 'unavailable', message: e.message } : e; };
  const guard = f => async (...a) => { try { return await f(...a); } catch (e) { throw mapErr(e); } };
  const doc = p => { const r = fs.doc(db, p); return {
    id: r.id, path: p,
    get: guard(async () => wrap(await fs.getDoc(r))),
    set: guard(d => fs.setDoc(r, clean(d))),
    update: guard(d => fs.updateDoc(r, flat(clean(d)))),
    delete: guard(() => fs.deleteDoc(r)),
    onSnapshot: (n, e) => fs.onSnapshot(r, s => n(wrap(s)), err => e && e(mapErr(err)))
  }; };
  const collection = p => { let lim = 1000; const qy = () => fs.query(fs.collection(db, p), fs.limit(lim)); const q = {
    path: p, limit: n => { lim = n; return q; }, doc: id => doc(p + '/' + (id || uidShort())),
    get: guard(async () => { const s = await fs.getDocs(qy()); return { docs: s.docs.map(wrap), size: s.size, empty: s.empty }; }),
    onSnapshot: (n, e) => fs.onSnapshot(qy(), { includeMetadataChanges: false }, s => n({ docs: s.docs.map(wrap), size: s.size, empty: s.empty, metadata: s.metadata }), err => e && e(mapErr(err)))
  }; return q; };
  const atomic = guard((p, fn) => fs.runTransaction(db, async t => { const r = fs.doc(db, p); const s = await t.get(r); const nx = fn(s.exists() ? s.data() : null); if (nx !== undefined) t.set(r, clean(nx)); return nx; }));
  // Photos: 'firestore' (default — free Spark plan, photos compressed to ~1600px and stored as documents)
  //         'storage'   (Cloud Storage — full-size files, needs the Blaze plan; see README)
  const cache = {};
  const toJpeg = async (blob, max, q) => { const bm = await createImageBitmap(blob); const sc = Math.min(1, max / Math.max(bm.width, bm.height)); const cv = document.createElement('canvas'); cv.width = Math.round(bm.width * sc); cv.height = Math.round(bm.height * sc); cv.getContext('2d').drawImage(bm, 0, 0, cv.width, cv.height); return await new Promise(r => cv.toBlob(r, 'image/jpeg', q)); };
  const b64of = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });
  const fromB64 = (d, type) => new Blob([Uint8Array.from(atob(d), c => c.charCodeAt(0))], { type });
  const assets = (opts.photos === 'storage') ? {
    upload: async (blob, o = {}) => { const type = o.type || blob.type || 'image/jpeg'; const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[type] || 'jpg'; const r = st.ref(storage, `photos/${Date.now()}-${uidShort()}.${ext}`); try { await st.uploadBytes(r, blob, { contentType: type, cacheControl: 'public,max-age=31536000' }); return { id: await st.getDownloadURL(r) }; } catch (e) { throw { code: String(e.code || '').includes('quota') ? 'quota_or_state' : 'upstream_error', message: e.message }; } },
    delete: async id => { try { await st.deleteObject(st.ref(storage, id)); } catch (e) {} return { deleted: true }; }
  } : {
    upload: async blob => {
      let max = 1600, q = 0.82, out = await toJpeg(blob, max, q);
      while (out.size > 650000 && max > 700) { max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.06); out = await toJpeg(blob, max, q); }
      const id = 'fs-' + Date.now() + '-' + uidShort();
      try { await fs.setDoc(fs.doc(db, 'photos/' + id), { type: 'image/jpeg', data: await b64of(out), bytes: out.size, at: new Date().toISOString() }); }
      catch (e) { throw mapErr(e); }
      cache[id] = URL.createObjectURL(out); return { id, url: cache[id] };
    },
    delete: async id => { try { await fs.deleteDoc(fs.doc(db, 'photos/' + id)); } catch (e) {} return { deleted: true }; },
    url: id => { if (cache[id]) return cache[id]; if (cache[id] === undefined) { cache[id] = null; fs.getDoc(fs.doc(db, 'photos/' + id)).then(s => { if (s.exists()) { cache[id] = URL.createObjectURL(fromB64(s.data().data, s.data().type)); renderSoon(); } }).catch(() => { delete cache[id]; }); } return null; },
    blob: async id => { const s = await fs.getDoc(fs.doc(db, 'photos/' + id)); return s.exists() ? fromB64(s.data().data, s.data().type) : null; }
  };
  return {
    db: { doc, collection, atomic }, assets,
    onAuth: cb => au.onAuthStateChanged(auth, cb),
    signIn: (email, pw) => au.signInWithEmailAndPassword(auth, email, pw),
    resetPw: email => au.sendPasswordResetEmail(auth, email),
    signOut: () => au.signOut(auth),
    call: async (name, data) => (await fu.httpsCallable(functions, name)(data)).data
  };
}

async function write(fn, label) {

    try { return await fn(); }

  } catch (e) {

// Activity log — appended atomically in monthly chunks per owner
async function logAct(type, verb, code, obj = '', detail = '', links = [], from = '', to = '') {

  const month = e.t.slice(0, 7).replace('-', '');
  try {
    await write(async () => {
      for (let part = 1; part < 40; part++) {
        const r = await S.db.atomic(`activity/${month}-${e.by}-${part}`, cur => { const list = (cur && Array.isArray(cur.entries)) ? cur.entries : []; if (list.length >= 600) return undefined; return { month, by: e.by, part, entries: [...list, e] }; });
        if (r !== undefined) return;
      }

// ── boot ──────────────────────────────────────────────────────────
async function boot() {
  const C = window.claude; const cfg = window.VAULT_CONFIG || {};
  // 1) inside claude.ai
  if (C && C.use) {
    const use = n => C.use(n).catch(() => null);
    const [db, assets, user, dl] = await Promise.all([use('db'), use('assets'), use('user'), use('downloads')]);
    if (db) { S.mode = 'claude'; S.live = true; S.db = claudeDB(db); S.assets = assets; S.user = user; S.dl = dl; S.uid = user ? await user.id().catch(() => null) : null; }
  }
  // 2) Firebase (GitHub Pages or any host) when config.js has keys
  if (!S.db && cfg.firebase && cfg.firebase.apiKey) {
    try { const fb = await firebaseBackend(cfg.firebase, { photos: cfg.photos }); S.fb = fb; S.mode = 'firebase'; S.live = true; S.db = fb.db; S.assets = fb.assets; }
    catch (e) { console.error(e); S.backendErr = 'Firebase could not start (' + (e.message || e) + '). Running in local mode.'; }
  }
  // 3) this browser only
  if (!S.db) { S.mode = 'local'; S.live = false; S.db = localDB(); S.assets = localAssets(); }
  if (S.mode === 'firebase') {
    await new Promise(res => S.fb.onAuth(u => { if (u) { S.uid = u.uid; S.fbEmail = u.email; S.needLogin = false; res(); } else { S.needLogin = true; S.uid = null; render(); } }));
    await S.fb.call('ensureVaultMembership', {}).catch(() => {});
  }
  const COLS = ['items', 'customers', 'purchases', 'sales', 'txs', 'activity'];
  for (const col of COLS) {
    S.db.collection(col).limit(1000).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
      S[col] = m; S.loaded[col] = true; renderSoon();
    }, err => { S.syncErr = err; if (err && err.code === 'revoked') toast(err.message || 'Access denied.', 'err'); S.loaded[col] = true; renderSoon(); });
  }
  ref('meta/settings').onSnapshot(s => {
    const d = s.exists ? s.data() : {};
    S.settings = { ...DEFAULT_SETTINGS, ...d, owners: { ...DEFAULT_SETTINGS.owners, ...(d.owners || {}) }, shopify: { ...DEFAULT_SETTINGS.shopify, ...(d.shopify || {}) } };
    S.loaded.settings = true; renderSoon();
  }, () => { S.loaded.settings = true; renderSoon(); });
  if (S.mode === 'firebase') S.db.collection('members').limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); S.members = m; renderSoon();
  }, () => {});
  await loadPins();
  const saved = (() => { try { return sessionStorage.getItem('ov.owner'); } catch (e) { return null; } })();
  if (saved && S.pins && S.pins.o1) S.owner = saved;
  window.addEventListener('hashchange', onRoute); onRoute();
  window.addEventListener('online', paintSync); window.addEventListener('offline', paintSync);
  setInterval(checkIdle, 30000);
  render();
}

// ── INVENTORY ─────────────────────────────────────────────────────
function itemMatch(i, q) { if (!q) return true; q = q.toLowerCase(); return [i.title, i.code, i.serial, i.specs, i.purchaseId, custName(i.customerId), i.bin].some(v => String(v || '').toLowerCase().includes(q)); }

const ival = (it, f) => (S.ui.edit[it.code] && f in S.ui.edit[it.code]) ? S.ui.edit[it.code][f] : (f.includes('.') ? f.split('.').reduce((o, k) => (o || {})[k], it) : it[f]);

const fSel = (it, f, label, opts, o = {}) => `<div class="fld ${o.cls || ''}"><label for="if-${f}">${o.icon ? `<span class="li">${ic(o.icon, 14, 1.9)}</span>` : ''}${label}</label><select class="sel" id="if-${f}" data-ifield="${f}" data-code="${esc(it.code)}">${o.blank ? `<option value="">${o.blank}</option>` : ''}${opts.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${String(ival(it, f) ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select></div>`;

    ${st === 'arch' ? `<button class="btn" data-act="unarchive" data-code="${esc(it.code)}">Restore to stock</button>` : st !== 'sold' ? `<button class="btn" data-act="archive" data-code="${esc(it.code)}">Archive</button>` : ''}
    ${nextSt && nextSt !== 'sold' && st !== 'arch' ? `<button class="btn pri" data-act="advance" data-code="${esc(it.code)}">Advance to ${STATUS[nextSt][0]}${ic('right', 16, 2)}</button>` : ''}
  </div></header>
  <div class="cols"><div class="col-main">

      ${fSel(it, 'customerId', 'Seller', custOpts, { icon: 'users' })}${fSel(it, 'source', 'Lead source', SOURCES, { icon: 'link' })}
      ${fIn(it, 'acquired', 'Date acquired', { type: 'date', icon: 'book' })}${fIn(it, 'confidence', 'Confidence score (0–100)', { icon: 'check', mono: 1 })}</div>
      <div class="fld"><label for="if-defect"><span class="li req">${ic('warn', 14, 1.9)}</span>Plain-English defect description <em>*</em></label><textarea class="ta" id="if-defect" data-ifield="defect" data-code="${esc(it.code)}" rows="3">${esc(ival(it, 'defect') || '')}</textarea></div>

    </section>

  </div><div class="col-side">

      ${e.realized ? '' : `<div class="row"><span class="mut">Risk allowance (${S.settings.riskPct}%)</span><span class="mono cor">${money(-e.risk)}</span></div>`}
      <div class="row"><span class="mut">Purchase cost</span><span class="mono cor">${money(-e.cost)}</span></div>
      <div class="glow" style="margin-top:14px;padding:16px;display:flex;justify-content:space-between;align-items:baseline"><span style="color:#9EE7BC">${e.realized ? 'Net profit' : 'Est. margin'}</span><span class="mono" style="font-size:26px;color:${e.margin >= 0 ? '#5FE6AC' : '#F2A08A'}">${money(e.margin)}</span></div>
      <div class="sm mut2" style="display:flex;justify-content:space-between;margin-top:10px"><span>ROI on cost</span><span class="mono" style="color:var(--tx2)">${e.cost ? (e.margin / e.cost * 100).toFixed(1) + '%' : '—'}</span></div></section>

    <section class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>History</h2>${hist.length ? hist.slice(0, 12).map(h => `<div style="display:flex;gap:10px;font-size:13px;line-height:1.45"><span class="av" style="width:22px;height:22px;font-size:10px;background:${(OWNER_COLORS[h.by] || ['#1F2725', '#9AA9A2'])[0]};color:${(OWNER_COLORS[h.by] || ['', '#06120D'])[1]}">${h.by === 'o1' ? 1 : h.by === 'o2' ? 2 : 'S'}</span><div><span style="font-weight:600">${esc(ownerName(h.by))}</span> <span class="mut">${esc(h.verb)}</span>${h.from || h.to ? ` <span class="mut2">${esc(h.from)} → ${esc(h.to)}</span>` : ''}<div class="sm mut2">${new Date(h.t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</div></div></div>`).join('') : '<div class="sm mut2">No recorded actions yet.</div>'}</section>

}
function packetCard(it, pk, photos, up, sh) {
  const tiles = photos.map((id, i) => `<div class="ph">${i === 0 ? '<span class="cover">Cover</span>' : ''}<img src="${esc(photoUrl(id))}" alt="Photo ${i + 1}" loading="lazy" onerror="this.style.opacity=.2"><div class="tools"><button data-act="phMove" data-code="${esc(it.code)}" data-i="${i}" data-d="-1" aria-label="Move left">${ic('chevL', 14)}</button>${i ? `<button data-act="phCover" data-code="${esc(it.code)}" data-i="${i}" aria-label="Make cover" title="Make cover">${ic('star', 14)}</button>` : ''}<button data-act="phDel" data-code="${esc(it.code)}" data-i="${i}" aria-label="Remove photo">${ic('trash', 14)}</button><button data-act="phMove" data-code="${esc(it.code)}" data-i="${i}" data-d="1" aria-label="Move right">${ic('chevR', 14)}</button></div></div>`).join('');
  const busy = Array.from({ length: up }, () => `<div class="ph" style="display:grid;place-items:center"><span class="sm mut">Uploading…</span></div>`).join('');
  const canUp = !!S.assets;
  const drop = photos.length + up < 12 ? (canUp ? `<label class="drop" data-drop="${esc(it.code)}">${ic('photo', 22)}<span>＋ Add photos<br><span class="mut2">or drop here</span></span><input type="file" accept="image/jpeg,image/png,image/webp" multiple data-upload="${esc(it.code)}" style="display:none"></label>` : `<div class="drop" style="cursor:default">${ic('lock', 18)}<span class="mut2">Uploads need edit access</span></div>`) : '';

function pBooks() {

  const months = [...new Set(all.map(t => (t.date || '').slice(0, 7)).filter(Boolean).concat([localISO().slice(0, 7)]))].sort().reverse();

  const inn = view.filter(t => num(t.amount) > 0).reduce((a, t) => a + num(t.amount), 0); const out = view.filter(t => num(t.amount) < 0).reduce((a, t) => a + num(t.amount), 0);
  const days = Array.from({ length: 14 }, (_, i) => localISO(new Date(Date.now() - (13 - i) * 864e5)));
  const dayOut = days.map(d => -all.filter(t => t.date === d && num(t.amount) < 0).reduce((a, t) => a + num(t.amount), 0)); const mx = Math.max(1, ...dayOut);

    `<section class="grid g-auto"><div class="card kpi"><span class="mut" style="font-size:13px">Money in</span><span class="v mono em">${money0(inn)}</span><span class="sm mut2">${mLabel(U.month)}</span></div><div class="card kpi"><span class="mut" style="font-size:13px">Money out</span><span class="v mono cor">${money0(out)}</span><span class="sm mut2">${money0(-view.filter(t => t.category === 'Inventory acquisition').reduce((a, t) => a + num(t.amount), 0))} of it inventory</span></div><div class="glow kpi"><span style="font-size:13px;color:#9EE7BC">Net recorded movement</span><span class="v mono">${money0(inn + out)}</span><span class="sm" style="color:#9EE7BC">${mLabel(U.month)}</span></div></section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h2>Money timeline</h2><div class="sm mut2" style="margin-top:4px">Daily outflows · last 14 days</div></div><span class="mono sm mut2">${fmtShort(days[0])} – ${fmtShort(days[13])}</span></div>
      <div role="img" aria-label="Daily outflows bar chart" style="display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid #24302B;padding:0 4px">${dayOut.map((v, i) => `<div title="${fmtShort(days[i])}: ${money(-v)}" style="flex:1 1 0;min-width:6px;border-radius:4px 4px 0 0;background:${i === 13 ? '#F6C2B3' : '#F2A08A'};height:${v ? Math.max(3, v / mx * 100) : 0}%"></div>`).join('')}</div></section>
    <section class="card" style="overflow:hidden"><div style="display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap">
      <select class="sel sm" id="b-month" data-bind="ui.books.month" aria-label="Month"><option value="all" ${U.month === 'all' ? 'selected' : ''}>All time</option>${months.map(m => `<option value="${m}" ${U.month === m ? 'selected' : ''}>${mLabel(m)}</option>`).join('')}</select>
      <select class="sel sm" id="b-dir" data-bind="ui.books.dir" aria-label="Direction"><option value="all">All transactions</option><option value="in" ${U.dir === 'in' ? 'selected' : ''}>Money in</option><option value="out" ${U.dir === 'out' ? 'selected' : ''}>Money out</option></select>
      <select class="sel sm" id="b-cat" data-bind="ui.books.cat" aria-label="Category"><option value="all">All categories</option>${TX_CATS.map(c => `<option ${U.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>

function pActivity() {
  const U = S.ui.act; let all = []; Object.values(S.activity).forEach(ch => (ch.entries || []).forEach(e => all.push(e)));
  all.sort((a, b) => b.t.localeCompare(a.t));
  const q = U.q.trim().toLowerCase();
  const view = all.filter(e => (U.type === 'all' || e.type === U.type) && (U.who === 'all' || e.by === U.who) && (!q || [e.code, e.obj, e.verb, e.detail, ...(e.links || [])].some(v => String(v || '').toLowerCase().includes(q)))).slice(0, 400);
  const groups = []; view.forEach(e => { const d = e.t.slice(0, 10); const day = localISO(new Date(e.t)); let g = groups[groups.length - 1]; if (!g || g.day !== day) groups.push(g = { day, items: [] }); g.items.push(e); });
  const dayLabel = d => d === localISO() ? 'Today · ' + fmtShort(d) : d === localISO(new Date(Date.now() - 864e5)) ? 'Yesterday · ' + fmtShort(d) : new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const week = all.filter(e => Date.now() - new Date(e.t) < 7 * 864e5); const wc = o => week.filter(e => e.by === o).length; const wmax = Math.max(1, wc('o1'), wc('o2'), wc('sys'));
  const keys = Object.keys(CODES);

      <div class="acts"><div class="tabs">${[['all', 'Everyone'], ['o1', ownerName('o1')], ['o2', ownerName('o2')], ['sys', 'System']].map(([k, l]) => `<button class="${U.who === k ? 'on' : ''}" data-act="actWho" data-v="${k}">${esc(l)}</button>`).join('')}</div><label class="search">${ic('search', 16)}<input id="a-q" type="search" data-bind="ui.act.q" value="${esc(U.q)}" placeholder="Search a code, e.g. VR-00012" aria-label="Search activity"></label></div></div>
    <div class="cols"><section class="card col-main" style="padding:6px 22px 18px;gap:0">${groups.length ? groups.map(g => `<div style="display:flex;align-items:center;gap:12px;padding:16px 0 6px"><span style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase" class="mut">${dayLabel(g.day)}</span><span style="flex-grow:1;height:1px;background:var(--line)"></span><span class="mono sm mut2">${g.items.length} actions</span></div>
      <ol class="tl" style="list-style:none;margin:0;padding:0">${g.items.map(e => { const c = CODES[e.type] || CODES.SYS; return `<li><span class="mono sm mut2" style="padding-top:16px;text-align:right">${new Date(e.t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span><span class="rail"><span class="pt" style="background:${c[1]};box-shadow:0 0 0 3px #111615,0 0 10px ${c[1]}"></span></span>
        <div style="padding:10px 0 14px;border-bottom:1px solid #18201D;display:flex;flex-direction:column;gap:8px;min-width:0"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px">${ownerAv(e.by)}<b style="font-weight:600">${esc(ownerName(e.by))}</b><span class="mut">${esc(e.verb)}</span>${e.code ? codeChip(e.code, CODES[codeType(e.code)] && codeType(e.code) !== 'SYS') : ''}<span style="color:var(--tx2)">${esc(e.obj)}</span></div>

      <section class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>Record codes</h2>${keys.map(k => `<div style="display:flex;align-items:center;gap:10px;font-size:13px"><span class="code" style="color:${CODES[k][1]};background:${CODES[k][2]};min-width:42px;justify-content:center;cursor:default">${k === 'SYS' ? 'SYS' : k + '-'}</span><span style="color:#C3CEC8">${CODES[k][0]}</span></div>`).join('')}</section>
      <section class="card pad"><h2 style="margin-bottom:8px">Audit trail</h2><p class="mut" style="margin:0;font-size:13px;line-height:1.55">Entries can’t be edited or deleted. Corrections are logged as new actions, so the history always shows who changed what.</p></section></div></div>`;

const FIELD_LABEL = { title: 'title', category: 'category', condition: 'condition', specs: 'specs', serial: 'serial', status: 'status', bin: 'location', customerId: 'seller', source: 'lead source', acquired: 'acquired date', confidence: 'confidence score', defect: 'defect description', notes: 'notes', resale: 'expected resale', cost: 'purchase cost' };
const NUMERIC = ['resale', 'cost', 'confidence', 'packet.price', 'sale.price', 'sale.fees', 'sale.ship'];
async function commitItemField(code, f, raw) {
  const it = S.items[code]; if (!it) return;
  let v = NUMERIC.includes(f) ? num(raw) : String(raw).trim(); if (f === 'confidence') v = Math.max(0, Math.min(100, Math.round(v)));
  const old = f.includes('.') ? f.split('.').reduce((o, k) => (o || {})[k], it) : it[f];
  if (String(old ?? '') === String(v)) { delete (S.ui.edit[code] || {})[f]; return; }
  if (f === 'title' && !v) { toast('The title can’t be empty.', 'err'); delete (S.ui.edit[code] || {})[f]; render(); return; }
  const patch = f.includes('.') ? { [f.split('.')[0]]: { [f.split('.')[1]]: v } } : { [f]: v };
  patch.updatedAt = nowISO(); patch.updatedBy = S.owner;
  try {
    await write(() => ref('items/' + code).update(patch), it.code);
    delete (S.ui.edit[code] || {})[f];
    if (f === 'status') logAct('VR', 'changed status of', code, it.title, '', [], STATUS[old] ? STATUS[old][0] : old, STATUS[v][0]);
    else if (f.startsWith('packet.')) logAct('LT', 'edited listing packet for', code, it.title, `Updated ${f.split('.')[1]}`);
    else if (f.startsWith('sale.')) { logAct('SL', 'edited sale details of', code, it.title, `${f.split('.')[1]}: ${old ?? '—'} → ${v}`); syncSaleTx(code); }
    else if (['bin', 'resale', 'cost', 'condition', 'category', 'customerId', 'source', 'acquired'].includes(f)) logAct(f === 'bin' ? 'AJ' : 'VR', 'edited ' + FIELD_LABEL[f] + ' of', code, it.title, '', [], String(old ?? '—'), String(v || '—'));
    else logAct('VR', 'edited ' + (FIELD_LABEL[f] || f) + ' of', code, it.title);
    if (f === 'cost' && it.purchaseId) syncPurchaseTotal(it.purchaseId);
  } catch (e) {}
}
async function syncSaleTx(code) {
  const it = S.items[code]; if (!it || !it.sale || !it.sale.txCode) return; const s = it.sale; const net = num(s.price) - num(s.fees) - num(s.ship);
  try { await write(() => ref('txs/' + s.txCode).update({ amount: +net.toFixed(2), date: s.date, desc: `Sale ${s.code} · ${it.title}`, updatedAt: nowISO() })); } catch (e) {}
}
async function syncPurchaseTotal(pu) {
  const p = S.purchases[pu]; if (!p) return; await sleep(400);
  const total = itemsArr().filter(i => i.purchaseId === pu).reduce((a, i) => a + num(i.cost), 0);
  try { await write(() => ref('purchases/' + pu).update({ total: +total.toFixed(2) })); if (p.txCode) await write(() => ref('txs/' + p.txCode).update({ amount: -(+total.toFixed(2)) })); } catch (e) {}
}
async function setStatus(code, st, verb) {
  const it = S.items[code]; if (!it) return; const old = it.status;
  try { await write(() => ref('items/' + code).update({ status: st, updatedAt: nowISO(), updatedBy: S.owner })); logAct(st === 'arch' ? 'AJ' : 'VR', verb || 'changed status of', code, it.title, '', [], STATUS[old][0], STATUS[st][0]); toast(`${it.code} → ${STATUS[st][0]}`); } catch (e) {}
}

async function prepImage(file) {
  if (file.size <= 4.5e6) { try { const bm = await createImageBitmap(file); const big = Math.max(bm.width, bm.height) > 3200; bm.close && bm.close(); if (!big) return file; } catch (e) { return file; } }
  const bm = await createImageBitmap(file); const scale = Math.min(1, 2400 / Math.max(bm.width, bm.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bm.width * scale); cv.height = Math.round(bm.height * scale);
  cv.getContext('2d').drawImage(bm, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(b => r(b || file), 'image/jpeg', 0.86));
}
async function uploadPhotos(code, files) {
  if (!S.assets) { toast('Photo uploads need edit access to this vault.', 'err'); return; }
  const list = [...files]; let added = 0;
  for (const f of list) {
    const it = S.items[code]; const cur = ((it && it.packet && it.packet.photos) || []);
    if (cur.length + (S.uploads[code] || 0) >= 12) { toast('Keep a maximum of 12 photos.', 'err'); break; }
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast(`${f.name}: use JPEG, PNG or WebP.`, 'err'); continue; }
    if (f.size > 25e6) { toast(`${f.name} is too large.`, 'err'); continue; }
    S.uploads[code] = (S.uploads[code] || 0) + 1; render();
    try {
      const blob = await prepImage(f); let r;
      try { r = await S.assets.upload(blob, { type: blob.type || f.type }); }
      catch (e) { if (e && e.code === 'store_unavailable') { await sleep(800); r = await S.assets.upload(blob, { type: blob.type || f.type }); } else throw e; }
      const latest = ((S.items[code] && S.items[code].packet && S.items[code].packet.photos) || []);
      await write(() => ref('items/' + code).update({ packet: { photos: [...latest.filter(x => x !== r.id), r.id] }, updatedAt: nowISO() }), 'photo');
      added++;
    } catch (e) {
      const m = { too_large: 'is too large', unsupported_type: 'is not a supported image', quota_or_state: 'could not be stored — photo storage is full', rate_limited: 'was rate-limited — try again shortly' }[e && e.code];
      toast(`${f.name} ${m || 'could not be uploaded. Try again.'}`, 'err');
    } finally { S.uploads[code] = Math.max(0, (S.uploads[code] || 1) - 1); render(); }
  }
  if (added) { toast(`${added} photo${added > 1 ? 's' : ''} saved to the vault.`); logAct('LT', `added ${added} photo${added > 1 ? 's' : ''} to`, code, (S.items[code] || {}).title); }
}

async function backup() {

}
async function restore(file) {
  let data; try { data = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t a valid backup.', 'err'); return; }
  const legacy = !data.app && Array.isArray(data.items);
  if (!legacy && data.app !== 'obsidian-vault') { toast('That file isn’t an Obsidian Vault backup.', 'err'); return; }
  const n = legacy ? data.items.length : Object.keys(data.items || {}).length;
  const ok = await confirmBox({ title: legacy ? 'Import old Obsidian Vault backup?' : 'Restore this backup?', body: legacy ? `${n} items from the old site will be added as new vault records with fresh VR codes. Nothing existing is deleted.` : `${n} items plus customers, transactions and activity will be written into the vault. Records with the same code are replaced; nothing else is deleted.`, ok: legacy ? 'Import' : 'Restore' });
  if (!ok) return;
  toast('Writing records… keep this tab open.');
  try {
    if (legacy) await importLegacy(data.items);
    else {
      const cols = ['items', 'customers', 'purchases', 'sales', 'txs', 'activity'];
      for (const c of cols) for (const [id, doc] of Object.entries(data[c] || {})) await write(() => ref(c + '/' + id).set(doc), id);
      if (data.settings) await write(() => ref('meta/settings').set(data.settings));
      for (const [k, v] of Object.entries(data.counters || {})) { const s = await ref('counters/' + k).get(); const cur = s.exists ? s.data().n || 0 : 0; if (v > cur) await write(() => ref('counters/' + k).set({ n: v })); }
    }
    toast('Restore complete.'); logAct('SYS', legacy ? 'imported the old site backup' : 'restored a backup', 'RESTORE', '', `${n} items`);
  } catch (e) { toast('Restore stopped partway. Run it again — it’s safe to repeat.', 'err'); }
}

    if (r.customer || ph) { if (ph && custByPhone[ph]) cu = custByPhone[ph]; else { cu = await nextCode('CU'); await write(() => ref('customers/' + cu).set({ code: cu, name: r.customer || 'Unnamed', phone: r.customerPhone || '', email: r.customerContact || '', source: r.source || 'Walk-in', notes: '', createdAt: nowISO(), by: S.owner })); if (ph) custByPhone[ph] = cu; } }

    }

// ── intake completion ─────────────────────────────────────────────
async function completeIntake() {
  const N = S.ui.intake; if (N.busy) return;
  if (!N.items.length) { N.err = 'Add at least one item to the purchase.'; return render(); }
  if (!N.customerId && (!N.c.name.trim() || !N.c.phone.trim())) { N.err = 'Enter the customer name and phone number.'; N.step = 2; return render(); }
  if (!N.confirm) { N.err = 'Confirm the customer owns these devices.'; return render(); }
  N.busy = true; N.err = ''; render();
  try {
    const pu = await nextCode('PU'); const tx = await nextCode('TX'); let cu = N.customerId; let newCust = false;
    if (!cu) { cu = await nextCode('CU'); newCust = true; await write(() => ref('customers/' + cu).set({ code: cu, name: N.c.name.trim(), phone: N.c.phone.trim(), email: N.c.email.trim(), source: N.c.source, notes: '', createdAt: nowISO(), lastDeal: N.date, by: N.by }), 'customer'); }
    else await write(() => ref('customers/' + cu).update({ lastDeal: N.date }), 'customer');
    const codes = []; let total = 0;
    for (const x of N.items) {
      const q = Math.round(num(x.qty) || 1);
      for (let k = 0; k < q; k++) {
        const vr = await nextCode('VR'); codes.push(vr); total += num(x.cost);
        await write(() => ref('items/' + vr).set({ code: vr, title: x.title.trim(), category: x.category, specs: x.specs.trim(), serial: x.serial.trim(), condition: x.condition, defect: x.defect.trim(), cost: num(x.cost), resale: num(x.resale), status: 'new', bin: '', source: newCust ? N.c.source : ((S.customers[cu] || {}).source || ''), customerId: cu, purchaseId: pu, acquired: N.date, confidence: 70, notes: '', by: N.by, createdAt: nowISO(), packet: { title: '', price: 0, description: '', photos: [] } }), vr);
      }
    }
    total = +total.toFixed(2);
    const custN = newCust ? N.c.name.trim() : (S.customers[cu] || {}).name || '';
    await write(() => ref('purchases/' + pu).set({ code: pu, customerId: cu, items: codes, total, method: N.method, ref: N.ref.trim(), date: N.date, by: N.by, txCode: tx, createdAt: nowISO() }), pu);
    await write(() => ref('txs/' + tx).set({ code: tx, date: N.date, desc: `Purchase ${pu} · ${codes.length} item${codes.length > 1 ? 's' : ''}`, amount: -total, category: 'Inventory acquisition', method: N.method, by: N.by, payee: custN, ref: N.ref.trim(), link: pu, tags: '', notes: '', createdAt: nowISO() }), tx);
    if (newCust) logAct('CU', 'added customer', cu, custN, `${N.c.source}`);
    logAct('PU', 'completed purchase', pu, `${codes.length} item${codes.length > 1 ? 's' : ''}`, `${money(total)} paid via ${N.method}`, [...codes, cu, tx]);
    S.ui.intake = null; toast(`Purchase ${pu} saved — ${codes.length} item${codes.length > 1 ? 's' : ''} added.`); go(codes.length === 1 ? '#/item/' + encodeURIComponent(codes[0]) : '#/inventory');
  } catch (e) { N.busy = false; N.err = (e && e.message) || 'Could not complete the purchase. Nothing was lost — try again.'; render(); }
}

      logAct('LT', (it.packet || {}).shopifyId ? 'updated the Shopify draft for' : 'created a Shopify draft for', lt, it.title, S.settings.shopify.store || '', [it.code]); toast('Shopify draft saved.');
    } catch (e) { if (productTab) productTab.close(); toast((e && e.message) || 'Shopify could not save the draft. Your packet is still safe in the Vault.', 'err'); }
  },
  pkActivate: async el => {
    const it = S.items[el.dataset.code]; if (!ShopifyAdapter.configured()) return go('#/settings'); const pk = it.packet || {};
    if (!pk.shopifyId) return toast('Create the Shopify draft first.', 'err');
    const n = listingUnitsOf(it).length;
    if (!await confirmBox({ title: `Activate ${it.code} on Shopify?`, body: `The product goes live on Shopify with a quantity of ${n}, and ${n > 1 ? `all ${n} units move` : 'the item moves'} to Listed in the Vault.`, ok: 'Activate listing' })) return;
    el.disabled = true;
    try {
      const res = await ShopifyAdapter.activate(it.code);
      logAct('LT', 'activated the Shopify listing for', pk.code || it.code, it.title, `Quantity ${res.quantity}`, res.units || [it.code], STATUS[it.status] ? STATUS[it.status][0] : it.status, 'Listed');
      toast(`Live on Shopify — ${res.quantity} unit${res.quantity > 1 ? 's' : ''} listed.`);
    } catch (e) { el.disabled = false; toast((e && e.message) || 'Shopify could not activate the listing. Nothing changed in the Vault.', 'err'); }
  },
  pkQty: async el => {
    const it = S.items[el.dataset.code]; const cur = listingUnitsOf(it); const d = +el.dataset.d;
    let next;
    if (d > 0) { const add = unitPool(it).find(i => !cur.includes(i.code)); if (!add) return toast('No more matching units in stock.', 'err'); next = [...cur, add.code]; }
    else { if (cur.length <= 1) return; next = cur.slice(0, -1); }
    const removed = cur.filter(c => !next.includes(c)); const added = next.filter(c => !cur.includes(c));
    try {
      await write(() => ref('items/' + it.code).update({ packet: { units: next }, updatedAt: nowISO() }), it.code);
      for (const c of added) await write(() => ref('items/' + c).update({ listedIn: it.code, updatedAt: nowISO() }), c);
      for (const c of removed) await write(() => ref('items/' + c).update({ listedIn: '', updatedAt: nowISO() }), c);
      logAct('LT', `set listing quantity to ${next.length} for`, it.code, it.title, '', next);
    } catch (e) {}
  },
  // intake
  inMulti: el => { S.ui.intake.multi = el.dataset.v === '1'; if (!S.ui.intake.multi) S.ui.intake.f.qty = 1; render(); },
  inCond: el => { S.ui.intake.f.condition = el.dataset.v; render(); },
  inBy: el => { S.ui.intake.by = el.dataset.v; render(); },
  inAdd: () => { const N = S.ui.intake; const e = validItem(N.f); if (e) { N.err = e; return render(); } if (N.f.serial.trim() && N.items.some(x => x.serial.trim() === N.f.serial.trim())) { N.err = 'This serial / IMEI is already in the purchase.'; return render(); } N.items.push({ ...N.f }); N.f = blankForm(N.f.category); N.err = ''; render(); },
  cartDel: el => { S.ui.intake.items.splice(+el.dataset.i, 1); render(); },
  inNext: () => {
    const N = S.ui.intake; N.err = '';
    if (N.step === 1) { const filled = N.f.title.trim() || num(N.f.cost); if (filled) { const e = validItem(N.f); if (e) { N.err = e; return render(); } if (!N.multi) N.items = []; N.items.push({ ...N.f }); N.f = blankForm(N.f.category); } if (!N.items.length) { N.err = 'Add at least one item to the purchase.'; return render(); } N.step = 2; }
    else if (N.step === 2) { if (N.custMode === 'existing' && !N.customerId) { N.err = 'Choose the returning customer, or switch to New customer.'; return render(); } if (N.custMode === 'new') { N.customerId = null; if (!N.c.name.trim() || !N.c.phone.trim()) { N.err = 'Enter the customer name and phone number.'; return render(); } if (N.c.email && !/^\S+@\S+\.\S+$/.test(N.c.email)) { N.err = 'Enter a valid email or leave it blank.'; return render(); } } N.step = 3; }
    render(); window.scrollTo(0, 0);
  },
  inBack: () => { const N = S.ui.intake; N.step = Math.max(1, N.step - 1); N.err = ''; render(); },
  inGo: el => { S.ui.intake.step = +el.dataset.v; render(); },
  inCancel: async () => { if (await confirmBox({ title: 'Discard this purchase?', body: 'The items and customer details you entered will be cleared.', ok: 'Discard', danger: 1 })) { S.ui.intake = null; go('#/dashboard'); } },
  inCust: el => { const N = S.ui.intake; N.custMode = el.dataset.v; if (el.dataset.v === 'new') N.customerId = null; N.err = ''; render(); },
  inPickCust: el => { const N = S.ui.intake; N.customerId = el.dataset.code; N.custMode = 'existing'; N.custQ = ''; N.err = ''; render(); },
  inSrc: el => { S.ui.intake.c.source = el.dataset.v; render(); },
  inPay: el => { S.ui.intake.method = el.dataset.v; render(); },
  inConfirm: el => { S.ui.intake.confirm = el.checked; render(); },
  inDone: () => completeIntake(),
  custIntake: el => { S.ui.intake = newIntake(); S.ui.intake.customerId = el.dataset.code; S.ui.intake.custMode = 'existing'; go('#/intake'); },
  // sale
  sChan: el => { const s = S.ui.sale; s.channel = el.dataset.v; s.feesTouched = el.dataset.v === 'Other' ? s.feesTouched : false; s.ship = el.dataset.v === 'Local' ? '0' : (num(s.ship) ? s.ship : String(S.settings.shipFlat || 0)); autoFees(s); render(); },
  sSave: () => completeSale(),
  // customers
  custSel: el => { S.ui.cust.sel = el.dataset.code; render(); },
  custNew: () => { S.modal = { kind: 'cust', d: { name: '', phone: '', email: '', source: 'Walk-in' } }; render(); },
  custSave: async () => { const M = S.modal, c = M.d; if (!c.name.trim() || !c.phone.trim()) { M.err = 'Enter the name and phone number.'; return render(); } M.busy = true; render(); try { const cu = await nextCode('CU'); await write(() => ref('customers/' + cu).set({ code: cu, name: c.name.trim(), phone: c.phone.trim(), email: c.email.trim(), source: c.source, notes: '', createdAt: nowISO(), by: S.owner })); logAct('CU', 'added customer', cu, c.name.trim(), c.source); S.ui.cust.sel = cu; S.modal = null; render(); toast(`Contact ${cu} saved.`); } catch (e) { M.busy = false; M.err = 'Could not save. Try again.'; render(); } },
  // books
  txNew: () => openTx(null),
  txEdit: el => openTx(S.txs[el.dataset.code]),
  txDir: el => { S.modal.d.dir = el.dataset.v; render(); },
  txBy: el => { S.modal.d.by = el.dataset.v; render(); },
  txSave: async () => {
    const M = S.modal, t = M.d; const amt = num(t.amt);
    if (!t.desc.trim() || !t.date || !(amt > 0)) { M.err = 'Enter a description, date and an amount greater than zero.'; return render(); }
    M.busy = true; render();
    try {
      const signed = t.dir === 'out' ? -amt : amt; const body = { date: t.date, desc: t.desc.trim(), amount: +signed.toFixed(2), category: t.category, method: t.method, by: t.by, payee: (t.payee || '').trim(), ref: (t.ref || '').trim(), tags: (t.tags || '').trim(), notes: (t.notes || '').trim(), updatedAt: nowISO() };
      if (t.code) { const old = S.txs[t.code]; await write(() => ref('txs/' + t.code).update(body)); logAct('TX', 'edited transaction', t.code, body.desc, '', [], money(old.amount, 1), money(body.amount, 1)); }
      else { const tx = await nextCode('TX'); await write(() => ref('txs/' + tx).set({ code: tx, link: '', ...body, createdAt: nowISO() })); logAct('TX', 'logged transaction', tx, body.desc, `${signed < 0 ? 'Money out' : 'Money in'} · ${money(signed, 1)} · ${body.method}`); }
      S.modal = null; render(); toast('Financial record saved.');
    } catch (e) { M.busy = false; M.err = 'Could not save the financial entry.'; render(); }
  },
  txDel: async () => { const t = S.modal.d; const keep = S.modal; if (!await confirmBox({ title: `Delete ${t.code}?`, body: 'This manually logged transaction is removed. The deletion is recorded in Activity.', ok: 'Delete', danger: 1 })) { S.modal = keep; return render(); } try { await write(() => ref('txs/' + t.code).delete()); logAct('TX', 'deleted transaction', t.code, t.desc, money(S.txs[t.code] ? S.txs[t.code].amount : 0, 1)); toast('Transaction deleted.'); } catch (e) {} },
  // activity
  actType: el => { S.ui.act.type = el.dataset.v; render(); },
  actWho: el => { S.ui.act.who = el.dataset.v; render(); },
  // settings
  shMode: async el => { await saveSetting({ shopify: { ...S.settings.shopify, mode: el.dataset.v } }); },
  memberInvite: async () => {
    const email = ($('#member-email') || {}).value || ''; const displayName = ($('#member-name') || {}).value || ''; const role = (($('#member-role') || {}).value || 'member');
    if (!email.trim()) return toast('Enter the new account email.', 'err');
    try { const r = await S.fb.call('createVaultMember', { email, displayName, role }); S.ui.memberInvite = { email: email.trim(), link: r.inviteLink }; render(); toast('Vault account added.'); }
    catch (e) { toast((e && e.message) || 'Could not add that account.', 'err'); }
  },
  memberCopy: async () => { try { await navigator.clipboard.writeText((S.ui.memberInvite || {}).link || ''); toast('Setup link copied.'); } catch (e) { const x = $('#member-link'); if (x) { x.select(); document.execCommand('copy'); toast('Setup link copied.'); } } },
  memberPin: async el => {
    const input = document.getElementById('member-pin-' + el.dataset.uid); const pin = input ? input.value : '';
    if (!/^\d{4,8}$/.test(pin)) return toast('Use a 4–8 digit member PIN.', 'err');
    try { await savePins({ ...(S.pins || {}), ['m_' + el.dataset.uid]: await hashPin(pin) }); input.value = ''; toast('Member PIN saved.'); render(); }
    catch (e) { toast('Could not save the member PIN.', 'err'); }
  },
  memberToggle: async el => {
    const active = el.dataset.active === '1';
    if (!await confirmBox({ title: `${active ? 'Enable' : 'Disable'} this account?`, body: active ? 'They will be able to sign in and use the Vault again.' : 'They will be signed out and blocked from the Vault.', ok: active ? 'Enable' : 'Disable', danger: active ? 0 : 1 })) return;
    try { await S.fb.call('setVaultMemberActive', { uid: el.dataset.uid, active }); toast(`Account ${active ? 'enabled' : 'disabled'}.`); } catch (e) { toast((e && e.message) || 'Could not update that account.', 'err'); }
  },
  binAdd: async () => { const v = ($('#bin-new').value || '').trim().toUpperCase(); if (!v) return; if (S.settings.bins.includes(v)) return toast('That bin already exists.', 'err'); await saveSetting({ bins: [...S.settings.bins, v] }); logAct('AJ', 'added storage bin', '', v); },
  binDel: async el => { const b = el.dataset.v; const n = itemsArr().filter(i => i.bin === b && STOCK.includes(i.status)).length; if (n && !await confirmBox({ title: `Remove bin ${b}?`, body: `${n} item${n > 1 ? 's are' : ' is'} still assigned to it. They keep the label until you move them.`, ok: 'Remove', danger: 1 })) return; await saveSetting({ bins: S.settings.bins.filter(x => x !== b) }); },
  backup: () => backup(),
  csvItems: () => saveFile(`vault-items-${localISO()}.csv`, csvItems()),
  csvTx: () => saveFile(`vault-transactions-${localISO()}.csv`, csvTx()),
  csvCust: () => saveFile(`vault-customers-${localISO()}.csv`, csvCust()),
  csvAct: () => saveFile(`vault-activity-${localISO()}.csv`, csvAct()),
  usage: async () => { try { const r = await S.assets.list(); const u = r.usage; $('#usage').innerHTML = `Photo storage: <span class="mono">${(u.bytes / 1048576).toFixed(1)} MB</span> of <span class="mono">${(u.maxBytes / 1048576).toFixed(0)} MB</span> · ${u.files} of ${u.maxFiles} files`; } catch (e) { toast('Couldn’t read storage usage.', 'err'); } },
  // firebase account
  fbSignIn: async () => { const L = S.login; if (!L.email.trim() || !L.pw) { L.err = 'Enter your email and password.'; return render(); } L.busy = true; L.err = ''; render(); try { await S.fb.signIn(L.email.trim(), L.pw); L.pw = ''; L.busy = false; } catch (e) { L.busy = false; const c = String(e.code || ''); L.err = c.includes('invalid') || c.includes('wrong') || c.includes('user-not-found') ? 'Email or password is incorrect.' : c.includes('too-many') ? 'Too many attempts. Wait a minute and try again.' : c.includes('network') ? 'No connection. Check the internet and try again.' : 'Could not sign in: ' + (e.message || c); render(); } },
  fbReset: async () => { const L = S.login; if (!L.email.trim()) { L.err = 'Enter your email first.'; return render(); } try { await S.fb.resetPw(L.email.trim()); L.info = 'Password reset email sent.'; L.err = ''; } catch (e) { L.err = 'Could not send the reset email.'; } render(); },
  fbSignOut: async () => { if (await confirmBox({ title: 'Sign this device out?', body: 'You’ll need the vault email and password to sign back in on this device.', ok: 'Sign out' })) { setOwner(null); await S.fb.signOut(); location.reload(); } },
  // modal
  mClose: (el, ev) => { if (el.dataset.self && ev.target !== el) return; const M = S.modal; S.modal = null; if (M && M.resolve) M.resolve(false); render(); },
  mOk: () => { const M = S.modal; S.modalVal = M.val || ''; S.modal = null; render(); if (M.resolve) M.resolve(true); }
};
async function saveSetting(patch) { try { const s = await ref('meta/settings').get(); if (s.exists) await write(() => ref('meta/settings').update(patch), 'settings'); else await write(() => ref('meta/settings').set({ ...DEFAULT_SETTINGS, ...patch }), 'settings'); } catch (e) {} }

document.addEventListener('click', ev => {
  S.lastAct = Date.now();
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.self && ev.target !== el) return;
  if (el.tagName === 'A' && el.getAttribute('href') && !['invTab'].includes(el.dataset.act)) return;
  if (el.tagName !== 'INPUT') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('input', ev => {
  S.lastAct = Date.now(); const el = ev.target;
  if (el.dataset.bind) {
    const p = el.dataset.bind; const path = p.startsWith('ui.') ? p : p.startsWith('modal') ? p : p;
    if (p.startsWith('lock.')) setPath(p, el.value.replace(/\D/g, '').slice(0, 8));
    else if (p.startsWith('login.')) { S.login[p.split('.')[1]] = el.value; return; }
    else setPath(path, el.value);
    if (p === 'ui.sale.price') autoFees(S.ui.sale); if (p === 'ui.sale.fees') S.ui.sale.feesTouched = true; if (p === 'modal.val') S.modal.val = el.value;
    if (p.startsWith('ui.master')) S.ui.master.page = 0;
    if (el.tagName !== 'SELECT' && !p.startsWith('lock.') && !p.startsWith('modal')) renderSoon();
  }
  if (el.dataset.ifield) { (S.ui.edit[el.dataset.code] = S.ui.edit[el.dataset.code] || {})[el.dataset.ifield] = el.value; }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.bind && el.tagName === 'SELECT') { setPath(el.dataset.bind, el.value); if (el.dataset.bind === 'ui.sale.code') { S.ui.sale = newSale(el.value); } if (S.modal && el.dataset.bind.startsWith('modal')) return; render(); }
  if (el.dataset.ifield) commitItemField(el.dataset.code, el.dataset.ifield, el.value);
  if (el.dataset.cfield) { const c = S.customers[el.dataset.code]; const f = el.dataset.cfield; const v = el.value.trim(); if (c && String(c[f] || '') !== v) write(() => ref('customers/' + c.code).update({ [f]: v, updatedAt: nowISO() })).then(() => logAct('CU', 'edited ' + f + ' of', c.code, c.name, '', [], f === 'notes' ? '' : String(c[f] || '—'), f === 'notes' ? '' : v)).catch(() => {}); }
  if (el.dataset.sfield) { const path = el.dataset.sfield; let v = el.value; if (['feePct', 'shipFlat', 'riskPct', 'autoLock'].includes(path)) v = num(v); if (path.includes('.')) { const [a, b] = path.split('.'); saveSetting({ [a]: { ...S.settings[a], [b]: typeof v === 'string' ? v.trim() : v } }); } else saveSetting({ [path]: v }); }
  if (el.dataset.upload) { uploadPhotos(el.dataset.upload, el.files); el.value = ''; }
  if (el.dataset.restore) { const f = el.files[0]; el.value = ''; if (f) restore(f); }
});
document.addEventListener('keydown', ev => {
  S.lastAct = Date.now();
  if (!S.owner && S.pins && S.pins.o1 && !(ev.target && ev.target.tagName === 'INPUT')) { if (/^\d$/.test(ev.key)) ACT.key({ dataset: { k: ev.key } }); else if (ev.key === 'Backspace') ACT.key({ dataset: { k: '⌫' } }); else if (ev.key === 'Enter') ACT.unlock(); }
  if (ev.key === 'Escape' && S.modal) ACT.mClose({ dataset: {} }, ev);
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.ifield && ev.target.tagName === 'INPUT') ev.target.blur();
  if (ev.key === 'Enter' && S.needLogin && ev.target.dataset && String(ev.target.dataset.bind || '').startsWith('login.')) ACT.fbSignIn();
});
document.addEventListener('dragover', ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) { ev.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', ev => { const z = ev.target.closest && ev.target.closest('[data-drop]'); if (z) { ev.preventDefault(); z.classList.remove('over'); uploadPhotos(z.dataset.drop, ev.dataTransfer.files); } });
// commit an inline item edit even if the page is closed mid-edit
window.addEventListener('pagehide', () => { const a = document.activeElement; if (a && a.dataset && a.dataset.ifield) commitItemField(a.dataset.code, a.dataset.ifield, a.value); });

boot().catch(e => { console.error(e); $('#app').innerHTML = '<div class="skel">The vault could not start. Reload the page.</div>'; });
})();
</script>
</body>
</html>
