# Deploys the Firebase backend (functions + database/storage rules) whenever
# they change on main. The website itself is served by GitHub Pages.
# Needs one repo secret: FIREBASE_SERVICE_ACCOUNT (a service-account JSON key).
name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'tests/**'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and test functions
        run: |
          npm install --prefix functions
          npm test --prefix functions

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test database rules in the emulator
        run: |
          npm install --no-save --prefix tests @firebase/rules-unit-testing@4 firebase@11
          npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-vault "node tests/rules.test.mjs"

      # Without the key, tests still run and the deploy is skipped (deploy from a computer instead).
      - name: Check the deploy key is set
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::Tests passed. Automatic deploy is off until the FIREBASE_SERVICE_ACCOUNT secret is added (GitHub → Settings → Secrets and variables → Actions). Deploy with: npx firebase-tools deploy --only functions,firestore:rules"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.key.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        if: steps.key.outputs.ok == 'true'
        run: npx --yes firebase-tools@latest deploy --only functions,firestore:rules,storage --project obsidian-vault-38dfd --non-interactive
